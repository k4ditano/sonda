[package]
name = "sonda"
version = "0.1.0"
edition = "2024"
description = "Search your computer by what is in your files, and walk it: a file manager for pleamar-wm, with EmbeddingGemma 2 on llama.cpp"
license = "MIT"

[dependencies]
anyhow = "1"
crossbeam-channel = "0.5"
half = "2"
ignore = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
libc = "0.2"
notify = "8"
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1_smol = "1"
zip = { version = "4", default-features = false, features = ["deflate"] }
zbus = "5"
blocking = "1"

[build-dependencies]
cc = "1"

[profile.release]
debug = false
lto = "thin"
